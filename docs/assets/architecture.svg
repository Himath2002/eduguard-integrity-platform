<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title description">
  <title id="title">EduGuard system architecture</title>
  <desc id="description">Four aligned architecture layers: role workspaces, FastAPI services, integrity intelligence, and persistence and delivery infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1600" height="840" rx="32" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="80" y="72" fill="#f8fafc" font-size="36" font-weight="800">Architecture with deliberate trust boundaries</text>
    <text x="80" y="108" fill="#94a3b8" font-size="19">A role-aware experience, a typed service layer, explainable integrity evidence, and private storage.</text>

    <g transform="translate(80,156)" filter="url(#shadow)">
      <rect width="1440" height="126" rx="24" fill="#0f1b2d" stroke="#334155"/>
      <text x="32" y="40" fill="#818cf8" font-size="15" font-weight="800" letter-spacing="2">01 · EXPERIENCE</text>
      <text x="32" y="78" fill="#f1f5f9" font-size="25" font-weight="750">React + TypeScript</text>
      <text x="32" y="104" fill="#94a3b8" font-size="16">Responsive, animated, role-protected workspaces</text>
      <g transform="translate(470,27)" font-size="18" font-weight="700" text-anchor="middle">
        <g><rect width="250" height="72" rx="18" fill="#17233a" stroke="#6366f1"/><text x="125" y="44" fill="#e2e8f0">Student workspace</text></g>
        <g transform="translate(286,0)"><rect width="250" height="72" rx="18" fill="#17233a" stroke="#8b5cf6"/><text x="125" y="44" fill="#e2e8f0">Lecturer workspace</text></g>
        <g transform="translate(572,0)"><rect width="250" height="72" rx="18" fill="#17233a" stroke="#06b6d4"/><text x="125" y="44" fill="#e2e8f0">Admin workspace</text></g>
      </g>
    </g>

    <line x1="800" y1="282" x2="800" y2="316" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(80,324)" filter="url(#shadow)">
      <rect width="1440" height="126" rx="24" fill="#0f1b2d" stroke="#334155"/>
      <text x="32" y="40" fill="#22d3ee" font-size="15" font-weight="800" letter-spacing="2">02 · APPLICATION SERVICES</text>
      <text x="32" y="78" fill="#f1f5f9" font-size="25" font-weight="750">FastAPI service boundary</text>
      <text x="32" y="104" fill="#94a3b8" font-size="16">Validation, authorization, orchestration, and contracts</text>
      <g transform="translate(430,27)" font-size="17" font-weight="700" text-anchor="middle">
        <g><rect width="210" height="72" rx="18" fill="#102436" stroke="#0891b2"/><text x="105" y="44" fill="#e2e8f0">Identity &amp; access</text></g>
        <g transform="translate(232,0)"><rect width="210" height="72" rx="18" fill="#102436" stroke="#0891b2"/><text x="105" y="44" fill="#e2e8f0">Assessment flows</text></g>
        <g transform="translate(464,0)"><rect width="210" height="72" rx="18" fill="#102436" stroke="#0891b2"/><text x="105" y="44" fill="#e2e8f0">Integrity review</text></g>
        <g transform="translate(696,0)"><rect width="242" height="72" rx="18" fill="#102436" stroke="#0891b2"/><text x="121" y="44" fill="#e2e8f0">Feedback &amp; messaging</text></g>
      </g>
    </g>

    <line x1="800" y1="450" x2="800" y2="484" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(80,492)" filter="url(#shadow)">
      <rect width="1440" height="126" rx="24" fill="#0f1b2d" stroke="#334155"/>
      <text x="32" y="40" fill="#a78bfa" font-size="15" font-weight="800" letter-spacing="2">03 · INTEGRITY INTELLIGENCE</text>
      <text x="32" y="78" fill="#f1f5f9" font-size="25" font-weight="750">Evidence generation</text>
      <text x="32" y="104" fill="#94a3b8" font-size="16">Signals inform-not replace-academic judgment</text>
      <g transform="translate(430,27)" font-size="17" font-weight="700" text-anchor="middle">
        <g><rect width="210" height="72" rx="18" fill="#201a3d" stroke="#8b5cf6"/><text x="105" y="44" fill="#e2e8f0">PDF extraction</text></g>
        <g transform="translate(232,0)"><rect width="210" height="72" rx="18" fill="#201a3d" stroke="#8b5cf6"/><text x="105" y="44" fill="#e2e8f0">Semantic matching</text></g>
        <g transform="translate(464,0)"><rect width="210" height="72" rx="18" fill="#201a3d" stroke="#8b5cf6"/><text x="105" y="44" fill="#e2e8f0">Multi-signal risk</text></g>
        <g transform="translate(696,0)"><rect width="242" height="72" rx="18" fill="#201a3d" stroke="#8b5cf6"/><text x="121" y="44" fill="#e2e8f0">Highlighted reports</text></g>
      </g>
    </g>

    <line x1="800" y1="618" x2="800" y2="652" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(80,660)" filter="url(#shadow)">
      <rect width="1440" height="126" rx="24" fill="#0f1b2d" stroke="#334155"/>
      <text x="32" y="40" fill="#34d399" font-size="15" font-weight="800" letter-spacing="2">04 · STATE &amp; DELIVERY</text>
      <text x="32" y="78" fill="#f1f5f9" font-size="25" font-weight="750">Private persistence</text>
      <text x="32" y="104" fill="#94a3b8" font-size="16">PostgreSQL is authoritative; S3 remains optional</text>
      <g transform="translate(430,27)" font-size="17" font-weight="700" text-anchor="middle">
        <g><rect width="210" height="72" rx="18" fill="#102b2a" stroke="#10b981"/><text x="105" y="44" fill="#e2e8f0">PostgreSQL + JSONB</text></g>
        <g transform="translate(232,0)"><rect width="210" height="72" rx="18" fill="#102b2a" stroke="#10b981"/><text x="105" y="34" fill="#e2e8f0">Local / private S3</text><text x="105" y="55" fill="#6ee7b7" font-size="12">OPTIONAL</text></g>
        <g transform="translate(464,0)"><rect width="210" height="72" rx="18" fill="#102b2a" stroke="#10b981"/><text x="105" y="44" fill="#e2e8f0">Celery workers</text></g>
        <g transform="translate(696,0)"><rect width="242" height="72" rx="18" fill="#102b2a" stroke="#10b981"/><text x="121" y="44" fill="#e2e8f0">WebSocket updates</text></g>
      </g>
    </g>
  </g>
</svg>
