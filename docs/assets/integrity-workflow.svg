<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title description">
  <title id="title">EduGuard integrity review workflow</title>
  <desc id="description">A five-step flow from controlled submission to extraction, analysis, human review, and feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0a1628"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="430" rx="30" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="70" y="68" fill="#f8fafc" font-size="34" font-weight="800">From submission to accountable feedback</text>
    <text x="70" y="104" fill="#94a3b8" font-size="18">Automation prepares evidence. A lecturer remains responsible for interpretation and action.</text>
    <line x1="220" y1="230" x2="1375" y2="230" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>

    <g text-anchor="middle">
      <g transform="translate(220,230)"><circle r="58" fill="#151b39" stroke="#6366f1" stroke-width="4"/><text y="8" fill="#e0e7ff" font-size="27" font-weight="800">01</text><text y="100" fill="#f8fafc" font-size="20" font-weight="750">Submit</text><text y="128" fill="#94a3b8" font-size="15">validate + store</text></g>
      <g transform="translate(510,230)"><circle r="58" fill="#151b39" stroke="#7c3aed" stroke-width="4"/><text y="8" fill="#ede9fe" font-size="27" font-weight="800">02</text><text y="100" fill="#f8fafc" font-size="20" font-weight="750">Extract</text><text y="128" fill="#94a3b8" font-size="15">normalize document text</text></g>
      <g transform="translate(800,230)"><circle r="58" fill="#151b39" stroke="#8b5cf6" stroke-width="4"/><text y="8" fill="#ede9fe" font-size="27" font-weight="800">03</text><text y="100" fill="#f8fafc" font-size="20" font-weight="750">Analyze</text><text y="128" fill="#94a3b8" font-size="15">match + risk signals</text></g>
      <g transform="translate(1090,230)"><circle r="68" fill="#102b36" stroke="#22d3ee" stroke-width="5"/><text y="8" fill="#cffafe" font-size="27" font-weight="800">04</text><text y="108" fill="#f8fafc" font-size="20" font-weight="800">Human review</text><text y="136" fill="#67e8f9" font-size="15" font-weight="700">DECISION GATE</text></g>
      <g transform="translate(1380,230)"><circle r="58" fill="#102b2a" stroke="#10b981" stroke-width="4"/><text y="8" fill="#d1fae5" font-size="27" font-weight="800">05</text><text y="100" fill="#f8fafc" font-size="20" font-weight="750">Communicate</text><text y="128" fill="#94a3b8" font-size="15">publish + discuss</text></g>
    </g>

    <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><line x1="278" y1="230" x2="440" y2="230"/><line x1="568" y1="230" x2="730" y2="230"/><line x1="858" y1="230" x2="1010" y2="230"/><line x1="1158" y1="230" x2="1310" y2="230"/></g>
  </g>
</svg>
